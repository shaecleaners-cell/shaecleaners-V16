<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta
  name="theme-color"
  content="#16a34a"
>

<title>Admin - Shae Cleaners</title>

<link
  rel="stylesheet"
  href="admin.css"
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

</head>


<body>


<div class="admin-app">


  <!-- =========================
       LOGIN
  ========================== -->

  <section id="loginBox" class="login-box">

    <div class="login-icon">
      <i class="fa-solid fa-shield-halved"></i>
    </div>

    <h2>Login Admin</h2>

    <p>
      Masuk untuk mengelola pesanan
      Shae Cleaners.
    </p>


    <input
      type="email"
      id="adminEmail"
      placeholder="Email admin"
      autocomplete="email"
    >


    <input
      type="password"
      id="adminPassword"
      placeholder="Password"
      autocomplete="current-password"
    >


    <button
      id="loginBtn"
      type="button"
    >

      <i class="fa-solid fa-right-to-bracket"></i>

      LOGIN ADMIN

    </button>


    <div
      id="loginError"
      class="login-error"
    ></div>

  </section>



  <!-- =========================
       DASHBOARD
  ========================== -->

  <section
    id="adminDashboard"
    style="display:none;"
  >


    <header>

      <div>

        <h1>
          Shae <span>Cleaners</span>
        </h1>

        <p>
          Panel Admin • Order Cleaning
        </p>

      </div>


      <button
        id="logoutBtn"
        type="button"
        class="admin-badge"
      >

        <i class="fa-solid fa-right-from-bracket"></i>

        KELUAR

      </button>

    </header>



    <!-- =========================
         STATISTIK
    ========================== -->

    <section class="stats">

      <div>
        <b id="totalOrders">0</b>
        <span>Total Order</span>
      </div>

      <div>
        <b id="waitingOrders">0</b>
        <span>Menunggu</span>
      </div>

      <div>
        <b id="confirmedOrders">0</b>
        <span>Dikonfirmasi</span>
      </div>

      <div>
        <b id="doneOrders">0</b>
        <span>Selesai</span>
      </div>

    </section>



    <!-- =========================
         TOOLBAR
    ========================== -->

    <div class="toolbar">

      <h2>
        Pesanan Terbaru
      </h2>


      <select id="filterStatus">

        <option value="">
          Semua Status
        </option>

        <option value="Menunggu Konfirmasi">
          Menunggu
        </option>

        <option value="Pesanan Dikonfirmasi">
          Dikonfirmasi
        </option>

        <option value="Diproses">
          Diproses
        </option>

        <option value="Selesai">
          Selesai
        </option>

      </select>

    </div>



    <!-- =========================
         ORDER
    ========================== -->

    <div id="orders">

      <div class="loading">
        Menghubungkan ke Firebase...
      </div>

    </div>


  </section>


</div>



<script
  type="module"
  src="admin.js"
></script>


</body>
</html>
