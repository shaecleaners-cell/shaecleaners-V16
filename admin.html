<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#00A86B"
>

<title>Admin - Shae Cleaners</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<link
  rel="stylesheet"
  href="admin.css"
>

</head>


<body>


<header class="admin-header">

  <div>

    <strong>
      Shae Cleaners
    </strong>

    <span>
      Admin Panel
    </span>

  </div>


  <button
    onclick="logoutAdmin()"
    title="Keluar"
  >

    <i class="fa-solid fa-right-from-bracket"></i>

  </button>

</header>


<!-- LOGIN -->

<section
  id="loginBox"
  class="login-box"
>

  <div class="login-icon">

    <i class="fa-solid fa-user-shield"></i>

  </div>

  <h2>
    Login Admin
  </h2>

  <p>
    Masuk untuk mengelola pesanan.
  </p>


  <input
    type="email"
    id="adminEmail"
    placeholder="Email admin"
  >


  <input
    type="password"
    id="adminPassword"
    placeholder="Password"
  >


  <button
    onclick="loginAdmin()"
    class="primary-button"
  >

    <i class="fa-solid fa-right-to-bracket"></i>

    Login Admin

  </button>


  <div
    id="loginError"
    class="login-error"
  ></div>

</section>


<!-- DASHBOARD -->

<main
  id="adminDashboard"
  class="admin-dashboard"
  style="display:none;"
>


  <div class="dashboard-title">

    <div>

      <strong>
        Pesanan Masuk
      </strong>

      <span>
        Kelola pesanan customer Shae Cleaners
      </span>

    </div>


    <button
      onclick="loadOrders()"
      class="refresh-button"
    >

      <i class="fa-solid fa-rotate"></i>

    </button>

  </div>


  <!-- STAT -->

  <div class="stats">

    <div class="stat-card">

      <span>
        Pesanan Baru
      </span>

      <strong id="newCount">
        0
      </strong>

    </div>


    <div class="stat-card">

      <span>
        Dikonfirmasi
      </span>

      <strong id="confirmedCount">
        0
      </strong>

    </div>


    <div class="stat-card">

      <span>
        Selesai
      </span>

      <strong id="doneCount">
        0
      </strong>

    </div>

  </div>


  <div
    id="orderList"
    class="order-list"
  >

    <div class="empty">
      Memuat pesanan...
    </div>

  </div>

</main>


<script src="admin.js"></script>

</body>

</html>
