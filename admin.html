<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Shae Cleaners</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
}

.header{
  background:#16a34a;
  color:white;
  padding:18px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.container{
  max-width:500px;
  margin:30px auto;
  padding:15px;
}

.login-box{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
}

.login-box h2{
  margin-top:0;
  text-align:center;
}

input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

button{
  width:100%;
  border:0;
  padding:14px;
  margin-top:10px;
  border-radius:8px;
  background:#16a34a;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

#adminPanel{
  display:none;
}

.order-card{
  background:white;
  padding:15px;
  margin:12px 0;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.logout{
  background:#dc2626;
}

.confirm{
  background:#16a34a;
}

.error{
  color:#dc2626;
  margin-top:10px;
  text-align:center;
}
</style>
</head>

<body>

<div class="header">
  SHAE CLEANERS - ADMIN
</div>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox" class="login-box">

    <h2>Login Admin</h2>

    <input
      type="email"
      id="adminEmail"
      placeholder="Email admin"
      autocomplete="email"
    >

    <input
      type="password"
      id="adminPassword"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginBtn" type="button">
      LOGIN ADMIN
    </button>

    <div id="loginError" class="error"></div>

  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPanel">

    <button id="logoutBtn" class="logout" type="button">
      LOGOUT
    </button>

    <h2>Pesanan Masuk</h2>

    <div id="ordersList">
      Memuat pesanan...
    </div>
  </div>
</div>
<script>
function loginAdmin() {

  alert("TOMBOL LOGIN BERHASIL DIKLIK");

}

function logoutAdmin() {

  alert("LOGOUT");

}

function loadOrders() {

  alert("LOAD ORDERS");

}
</script>
<script type="module" src="admin.js"></script>
</body>
</html>
