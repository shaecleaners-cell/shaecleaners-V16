<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#00A86B"
  >

  <title>Daftar - Shae Cleaners</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link
    rel="stylesheet"
    href="register.css"
  >

</head>


<body>


<div class="register-page">


  <!-- HEADER -->

  <header class="register-header">

    <button
      class="back-button"
      onclick="goBack()"
    >

      <i class="fa-solid fa-arrow-left"></i>

    </button>


    <div class="brand">

      <div class="brand-icon">

        <i class="fa-solid fa-sparkles"></i>

      </div>


      <strong>
        Shae Cleaners
      </strong>


      <span>
        Cleaning Service Profesional
      </span>

    </div>

  </header>



  <!-- FORM -->

  <main class="register-card">


    <h1>
      Buat Akun Baru
    </h1>


    <p class="subtitle">
      Daftar untuk melakukan pemesanan
      dengan lebih cepat.
    </p>



    <form
      id="registerForm"
      onsubmit="registerUser(event)"
    >


      <!-- NAMA -->

      <div class="input-group">

        <label>
          Nama Lengkap
        </label>


        <div class="input-box">

          <i class="fa-solid fa-user"></i>


          <input
            type="text"
            id="name"
            placeholder="Masukkan nama lengkap"
            autocomplete="name"
            required
          >

        </div>

      </div>



      <!-- WHATSAPP -->

      <div class="input-group">

        <label>
          Nomor WhatsApp
        </label>


        <div class="input-box">

          <i class="fa-brands fa-whatsapp"></i>


          <input
            type="tel"
            id="phone"
            placeholder="08xxxxxxxxxx"
            autocomplete="tel"
            required
          >

        </div>

      </div>



      <!-- PASSWORD -->

      <div class="input-group">

        <label>
          Password
        </label>


        <div class="input-box">

          <i class="fa-solid fa-lock"></i>


          <input
            type="password"
            id="password"
            placeholder="Minimal 6 karakter"
            autocomplete="new-password"
            required
          >


          <button
            type="button"
            class="eye-button"
            onclick="togglePassword('password','eyePassword')"
          >

            <i
              id="eyePassword"
              class="fa-solid fa-eye"
            ></i>

          </button>

        </div>

      </div>



      <!-- KONFIRMASI -->

      <div class="input-group">

        <label>
          Konfirmasi Password
        </label>


        <div class="input-box">

          <i class="fa-solid fa-lock"></i>


          <input
            type="password"
            id="confirmPassword"
            placeholder="Ulangi password"
            autocomplete="new-password"
            required
          >


          <button
            type="button"
            class="eye-button"
            onclick="togglePassword('confirmPassword','eyeConfirm')"
          >

            <i
              id="eyeConfirm"
              class="fa-solid fa-eye"
            ></i>

          </button>

        </div>

      </div>



      <!-- ERROR -->

      <div
        id="registerError"
        class="error-message"
      ></div>



      <!-- BUTTON -->

      <button
        type="submit"
        class="register-button"
      >

        <span>
          Daftar Sekarang
        </span>


        <i class="fa-solid fa-arrow-right"></i>

      </button>


    </form>



    <!-- LOGIN -->

    <div class="login-link">

      <span>
        Sudah punya akun?
      </span>


      <button onclick="goLogin()">

        Login

      </button>

    </div>


  </main>



  <footer>

    © 2026 Shae Cleaners

  </footer>


</div>



<script src="register.js"></script>

</body>

</html>
